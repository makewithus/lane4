</head><body><div data-node-type="commerce-checkout-form-container" data-wf-checkout-query="query Dynamo3 {

          decimalValue
          string
          unit
          value
        }
        selected

      comment
      customData {
        checkbox

      customerInfo {

        shouldRecalc

      subtotal {
        decimalValue

      }
      total {

        unit
        value

      updatedOn
      userItems {

            id

  <div class="w-commerce-commercelayoutcontainer w-container" style="display:flex;gap:32px;align-items:flex-start;margin-top:20px;margin-bottom:40px;">
    
    <!-- LEFT MAIN COLUMN -->
    <div class="w-commerce-commercelayoutmain" id="lane4-checkout-main-col" style="flex:1;min-width:0;">
      
      <!-- Customer Info -->
      <form class="w-commerce-commercecheckoutcustomerinfowrapper" novalidate="" style="margin-bottom:24px;">
        <div class="w-commerce-commercecheckoutblockheader" style="border-bottom:1px solid #e2e8f0;padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">
          <h4 aria-level="2" class="header-text" style="margin:0;font-size:18px;font-weight:900;color:#0f172a;">Customer Info</h4>
          <span style="font-size:12px;color:#64748b;">* Required</span>
        </div>
        <fieldset class="w-commerce-commercecheckoutblockcontent">
          <label for="wf-ecom-email" class="w-commerce-commercecheckoutlabel header-text" style="display:block;font-size:12px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:#334155;margin-bottom:6px;">Email Address *</label>
          <input id="wf-ecom-email" class="w-commerce-commercecheckoutemailinput" type="email" name="email" required="" placeholder="swimmer@example.com" style="width:100%;height:46px;padding:10px 14px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;box-sizing:border-box;">
        </fieldset>
      </form>

      <!-- Shipping Address -->
      <form class="w-commerce-commercecheckoutshippingaddresswrapper" novalidate="" style="margin-bottom:24px;">
        <div class="w-commerce-commercecheckoutblockheader" style="border-bottom:1px solid #e2e8f0;padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">
          <h4 aria-level="2" class="header-text" style="margin:0;font-size:18px;font-weight:900;color:#0f172a;">Shipping Address</h4>
          <span style="font-size:12px;color:#64748b;">* Required</span>
        </div>
        <fieldset class="w-commerce-commercecheckoutblockcontent">
          <div style="margin-bottom:14px;">
            <label class="w-commerce-commercecheckoutlabel header-text" style="display:block;font-size:12px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:#334155;margin-bottom:6px;">Full Name *</label>
            <input class="w-commerce-commercecheckoutshippingfullname" id="lane4-checkout-fullname" name="name" type="text" required="" placeholder="e.g. Rohan Sharma" style="width:100%;height:46px;padding:10px 14px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;box-sizing:border-box;">
          </div>

          <div id="lane4-checkout-phone-wrapper" style="margin-bottom:14px;">
            <label class="w-commerce-commercecheckoutlabel header-text" style="display:block;font-size:12px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:#334155;margin-bottom:6px;">Mobile Phone Number (for shipment updates) *</label>
            <input type="tel" id="lane4-checkout-phone" class="w-input lane4-checkout-phone-input" name="phone" placeholder="+91 98765 43210" required="" maxlength="10" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);" style="width:100%;height:46px;padding:10px 14px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;box-sizing:border-box;">
          </div>

          <div style="margin-bottom:14px;">
            <label class="w-commerce-commercecheckoutlabel header-text" style="display:block;font-size:12px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:#334155;margin-bottom:6px;">Street Address *</label>
            <input class="w-commerce-commercecheckoutshippingstreetaddress" id="lane4-checkout-street-address" name="address_line1" type="text" required="" placeholder="Flat/House No., Building, Street Name" style="width:100%;height:46px;padding:10px 14px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;box-sizing:border-box;">
          </div>

          <div style="margin-bottom:14px;">
            <input class="w-commerce-commercecheckoutshippingstreetaddressoptional" id="lane4-checkout-street-address2" name="address_line2" type="text" placeholder="Apartment, suite, landmark (optional)" style="width:100%;height:46px;padding:10px 14px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;box-sizing:border-box;">
          </div>

          <div class="w-commerce-commercecheckoutrow" style="display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
            <div class="w-commerce-commercecheckoutcolumn" style="flex:1;min-width:180px;">
              <label class="w-commerce-commercecheckoutlabel header-text" style="display:block;font-size:12px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:#334155;margin-bottom:6px;">State / UT *</label>
              <select id="lane4-checkout-state" class="w-commerce-commercecheckoutshippingstateprovince lane4-checkout-select" name="address_state" required="">
                <option value="">Select State / UT</option>
              </select>
            </div>
            <div class="w-commerce-commercecheckoutcolumn" style="flex:1;min-width:180px;">
              <label class="w-commerce-commercecheckoutlabel header-text" style="display:block;font-size:12px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:#334155;margin-bottom:6px;">City *</label>
              <select id="lane4-checkout-city-select" class="w-commerce-commercecheckoutshippingcity lane4-checkout-select" name="address_city_select" required="" disabled="">
                <option value="">Select State first</option>
              </select>
              <input type="text" id="lane4-checkout-city-custom" class="w-commerce-commercecheckoutshippingcity" name="address_city_custom" placeholder="Type your city name" style="display:none;margin-top:6px;width:100%;height:44px;padding:8px 12px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;box-sizing:border-box;" />
            </div>
            <div class="w-commerce-commercecheckoutcolumn" style="flex:1;min-width:140px;">
              <label class="w-commerce-commercecheckoutlabel header-text" style="display:block;font-size:12px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:#334155;margin-bottom:6px;">PIN / Postal Code *</label>
              <input class="w-commerce-commercecheckoutshippingzippostalcode" id="lane4-checkout-zip" name="address_zip" type="text" placeholder="e.g. 440001" required="" maxlength="6" minlength="6" inputmode="numeric" autocomplete="postal-code" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);" style="width:100%;height:46px;padding:10px 14px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;font-weight:500;box-sizing:border-box;">
            </div>
          </div>

          <div>
            <label class="w-commerce-commercecheckoutlabel header-text" style="display:block;font-size:12px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:#334155;margin-bottom:6px;">Country</label>
            <select id="lane4-checkout-country" class="w-commerce-commercecheckoutshippingcountryselector lane4-checkout-select" name="address_country" disabled="">
              <option value="India" selected="">India (PAN India Express Delivery)</option>
            </select>
          </div>
        </fieldset>
      </form>

      <!-- Shipping Method -->
      <div class="w-commerce-commercecheckoutshippingmethodswrapper" style="margin-bottom:24px;">
        <div class="w-commerce-commercecheckoutblockheader" style="border-bottom:1px solid #e2e8f0;padding-bottom:8px;margin-bottom:14px;">
          <h4 aria-level="2" class="header-text" style="margin:0;font-size:18px;font-weight:900;color:#0f172a;">Shipping Method</h4>
        </div>
        <fieldset class="w-commerce-commercecheckoutblockcontent">
          <div id="lane4-shipping-method-card" style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:#f8fafc;border:2px solid #0f172a;border-radius:10px;gap:12px;">
            <label style="display:flex;align-items:center;gap:12px;margin:0;cursor:pointer;flex:1;">
              <input type="radio" name="shipping-method-choice" value="standard" checked="" style="width:18px;height:18px;accent-color:#000;" />
              <div>
                <div style="font-weight:900;font-size:14.5px;color:#0f172a;">PAN India Express Delivery</div>
                <div style="font-size:12px;color:#64748b;margin-top:2px;">Dispatched via BlueDart / Delhivery / DTDC (Tracked) • Estimated 3–6 business days</div>
              </div>
            </label>
            <div id="lane4-shipping-price-badge" style="font-weight:900;font-size:15px;color:#16a34a;white-space:nowrap;">FREE</div>
          </div>
        </fieldset>
      </div>

      <!-- Payment Info (UPI QR Injection Point) -->
      <div class="w-commerce-commercecheckoutpaymentinfowrapper" style="margin-bottom:24px;"></div>

      <!-- Items in Order -->
      <div class="w-commerce-commercecheckoutorderitemswrapper" style="margin-bottom:24px;">
        <div class="w-commerce-commercecheckoutsummaryblockheader" style="border-bottom:1px solid #e2e8f0;padding-bottom:8px;margin-bottom:14px;">
          <h4 aria-level="2" class="header-text" style="margin:0;font-size:18px;font-weight:900;color:#0f172a;">Items in Order</h4>
        </div>
        <fieldset class="w-commerce-commercecheckoutblockcontent">
          <div id="lane4-checkout-items-list" class="w-commerce-commercecheckoutorderitemslist" style="padding:4px 0;">
            <div style="padding:16px 0;text-align:center;color:#64748b;">Loading order items...</div>
          </div>
        </fieldset>
      </div>

    </div>

    <!-- RIGHT SIDEBAR (Order Summary & Place Order Button) -->
    <div class="w-commerce-commercelayoutsidebar" id="lane4-checkout-sidebar" style="width:360px;flex-shrink:0;">
      <div class="w-commerce-commercecheckoutordersummarywrapper" style="background:#ffffff;border:1.5px solid #e2e8f0;border-radius:10px;padding:22px;box-shadow:0 4px 16px rgba(0,0,0,0.04);">
        <div class="w-commerce-commercecheckoutsummaryblockheader" style="border-bottom:1px solid #f1f5f9;padding-bottom:12px;margin-bottom:14px;">
          <h4 aria-level="2" class="header-text" style="margin:0;font-size:17px;font-weight:900;color:#0f172a;letter-spacing:0.5px;">Order Summary</h4>
        </div>
        <fieldset class="w-commerce-commercecheckoutblockcontent">
          <div class="w-commerce-commercecheckoutsummarylineitem" style="display:flex;justify-content:space-between;padding:8px 0;font-size:14px;">
            <div style="color:#64748b;font-weight:700;">Subtotal</div>
            <div id="lane4-summary-subtotal" style="font-weight:900;font-size:15px;color:#0f172a;">₹0.00</div>
          </div>
          <div id="lane4-summary-extra-list" class="w-commerce-commercecheckoutordersummaryextraitemslist">
            <div class="w-commerce-commercecheckoutordersummaryextraitemslistitem" style="display:flex;justify-content:space-between;padding:6px 0;font-size:14px;">
              <div style="color:#64748b;font-weight:700;">Shipping</div>
              <div id="lane4-summary-shipping" style="font-weight:900;color:#16a34a;">FREE</div>
            </div>
            <div id="lane4-summary-discount-row" style="display:none;justify-content:space-between;padding:6px 0;font-size:14px;color:#16a34a;">
              <div style="font-weight:800;">Coupon (<span id="lane4-summary-discount-code"></span>)</div>
              <div id="lane4-summary-discount" style="font-weight:900;">-₹0.00</div>
            </div>
          </div>
          <div class="w-commerce-commercecheckoutsummarylineitem" style="display:flex;justify-content:space-between;padding:14px 0 6px;border-top:1.5px solid #f1f5f9;margin-top:8px;align-items:center;">
            <div style="font-weight:900;font-size:16px;color:#0f172a;">Total Payable</div>
            <div id="lane4-summary-total" style="font-weight:900;font-size:24px;color:#0f172a;">₹0.00</div>
          </div>
        </fieldset>
      </div>

      <!-- Promotional Coupon Card -->
      <div id="lane4-checkout-coupon-box" style="margin:16px 0;padding:16px 18px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;">
        <label style="display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;color:#334155;">Promotional Coupon</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="lane4-coupon-input" placeholder="e.g. WELCOME10" style="flex:1;padding:10px 12px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:13px;text-transform:uppercase;font-weight:800;background:#ffffff;" />
          <button type="button" id="lane4-apply-coupon-btn" style="background:#0f172a;color:#ffffff;border:none;padding:10px 18px;border-radius:6px;font-weight:900;font-size:12px;letter-spacing:1px;cursor:pointer;">APPLY</button>
        </div>
        <div id="lane4-coupon-msg" style="font-size:12px;font-weight:700;margin-top:8px;display:none;"></div>
      </div>

      <!-- Action Button -->
      <button type="button" id="lane4-place-order-btn" class="w-commerce-commercecheckoutplaceorderbutton submit-order" style="width:100%;background:#000000;color:#ffffff;border:none;border-radius:8px;padding:16px;font-size:13.5px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all 0.15s ease;box-shadow:0 4px 14px rgba(0,0,0,0.18);display:flex;align-items:center;justify-content:center;gap:8px;">
        <span>PLACE ORDER &amp; SUBMIT PAYMENT</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </div>

  </div>
</div>
